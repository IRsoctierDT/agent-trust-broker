name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gate tooling
        run: pip install pytest ruff mypy bandit

      - name: Everything compiles
        run: python -m compileall -q atb tests

      - name: Conformance suite (T1-T12)
        run: python -m pytest -q

      - name: Lint
        run: ruff check .

      - name: Static types (strict)
        run: mypy atb tests

      - name: Security static analysis
        run: bandit -r atb -q

      - name: Detect prohibited secret-like files
        shell: bash
        run: |
          if find . -path ./.git -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' \) -print | grep -q .; then
            echo "Prohibited secret-like file detected."
            exit 1
          fi
