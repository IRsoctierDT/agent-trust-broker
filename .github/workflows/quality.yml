name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gate tooling
        run: pip install pytest pytest-cov ruff mypy bandit pip-audit "detect-secrets==1.5.0"

      - name: Everything compiles
        run: python -m compileall -q atb tests examples

      - name: Conformance suite (T1-T12) with coverage gate
        run: python -m pytest -q --cov=atb --cov-report=term-missing --cov-fail-under=85

      - name: Lint
        run: ruff check .

      - name: Static types (strict)
        run: mypy atb tests examples

      - name: Format check
        run: ruff format --check .

      - name: Demo runs end to end
        run: python -m examples.demo

      - name: Security static analysis
        run: bandit -r atb -q

      - name: Dependency vulnerability scan (SCA)
        run: pip-audit

      - name: Secret scan against baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Detect prohibited secret-like files
        shell: bash
        run: |
          if find . -path ./.git -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' \) -print | grep -q .; then
            echo "Prohibited secret-like file detected."
            exit 1
          fi
