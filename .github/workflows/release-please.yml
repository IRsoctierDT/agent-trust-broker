name: release-please

# Automated releases from Conventional Commits.
# On each push to main (and on workflow_dispatch), release-please opens/updates a
# release PR that bumps pyproject.toml / marked version lines + CHANGELOG.md.
# Merging that PR tags the release, creates the GitHub Release, and the
# publish job pushes to PyPI via Trusted Publishing (OIDC, `pypi` environment).
# Never hand-edit version numbers on feature branches.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Manifest mode exposes `releases_created` (not `release_created`); gate
      # publish on it. See IANUA-Broker/.github/workflows/release-please.yml.
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC Trusted Publishing — no stored token
      contents: write # attach SBOM + checksums to the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: tag
        run: |
          PKG=$(python -c "import json; print(json.load(open('release-please-config.json'))['packages']['.']['package-name'])")
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "name=${PKG}-v${VER}" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install .
          cyclonedx-py environment -o sbom.cdx.json

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach SBOM + checksums to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            SHA256SUMS
            sbom.cdx.json
